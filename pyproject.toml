[project]
name = "suspiciousness"
dynamic = ["version"]
description = "Quantifying tensions between datasets."
authors = [{name="Adam Neil Ormondroyd", email="Adam.Ormondroyd@gmail.com"}]
readme = "README.md"
dependencies = ["numpy", "scipy", "matplotlib", "anesthetic"]

[project.urls]
repository = "https://github.com/AdamOrmondroyd/suspiciousness"

[build-system]
requires = ["setuptools_scm>=8"]

[tool.setuptools_scm]
version_file = "suspiciousness/_version.py"
